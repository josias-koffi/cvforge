# CVSpark stack as Dokploy runs it. Standalone: no build, images only.
#
# Dokploy owns this file's lifecycle through `dokploy_compose` in
# ../dokploy/compose.tf, which ships it inline (`raw.compose_file`). Dokploy
# names the compose project itself, resolves the variables below from the `env`
# block of that resource, and injects the Traefik labels from the
# `dokploy_domain` resources. Never edit the deployed copy in the Dokploy UI.
#
# ---------------------------------------------------------------------------
# `svcprefix` IS A PLACEHOLDER, NOT A SERVICE NAME.
#
# compose.tf replaces every occurrence with the environment's service prefix
# (`cvspark` in production, `cvspark-staging` in staging) before shipping the
# file. That is why this YAML is not directly runnable with `docker compose`.
#
# It exists because Dokploy attaches every service of every stack to the shared
# `dokploy-network`, registering the compose service name as a network alias.
# Two stacks that both name a service `api` therefore publish the same alias on
# one network, and Docker's DNS answers with either container, at random. That
# is not theoretical: production's web resolved `api` to the staging API and
# emailed a staging magic link, which logged nobody in. Prefixing the service
# names makes every alias unique per environment, so internal DNS can only ever
# reach this stack.
# ---------------------------------------------------------------------------
#
# Differences from the SSH-pipeline file next door (docker-compose.yml):
#   - no `name:` — Dokploy assigns the compose project name
#   - no Traefik labels and no external `traefik-public` network — Dokploy's own
#     Traefik routes from the `dokploy_domain` resources instead
#   - service names are prefixed, and internal URLs target those prefixed names

services:
  svcprefix-web:
    image: ghcr.io/josias-koffi/cvspark-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://svcprefix-api:3333
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  svcprefix-landing:
    image: ghcr.io/josias-koffi/cvspark-landing:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The landing only links to the app; /login redirects to this origin.
      APP_URL: https://${WEB_DOMAIN}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  svcprefix-api:
    image: ghcr.io/josias-koffi/cvspark-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${WEB_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      PUPPETEER_URL: ${PUPPETEER_URL:-http://svcprefix-puppeteer:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      INTERVIEW_STT_MODEL: ${INTERVIEW_STT_MODEL:-}
      INTERVIEW_AI_MODEL: ${INTERVIEW_AI_MODEL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      AUTH_MAGIC_LINK_TTL_MINUTES: ${AUTH_MAGIC_LINK_TTL_MINUTES:-15}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-7}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SMTP_PROVIDER: ${SMTP_PROVIDER}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
    volumes:
      # Real datastore of the API (JSON state files) — never drop this volume.
      - api_data:/workspace/.data
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  svcprefix-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvforge}
      POSTGRES_USER: ${POSTGRES_USER:-cvforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvforge}"]
      interval: 15s
      timeout: 5s
      retries: 10

  svcprefix-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  svcprefix-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data

  svcprefix-puppeteer:
    image: ghcr.io/josias-koffi/cvspark-puppeteer:${IMAGE_TAG}
    restart: unless-stopped

  # Nightly pg_dump → compressed file in the db_backups volume.
  # Keeps 7 daily + 4 weekly + 6 monthly snapshots.
  # WARNING: on-VPS backup only — it does NOT survive VPS destruction.
  svcprefix-db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      - svcprefix-postgres
    environment:
      POSTGRES_HOST: svcprefix-postgres
      POSTGRES_DB: ${POSTGRES_DB:-cvforge}
      POSTGRES_USER: ${POSTGRES_USER:-cvforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "--schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - db_backups:/backups

# Volume names are pinned to VOLUME_PREFIX instead of the compose project name,
# so production keeps using the volumes created under the old `cvforge` project.
# Renaming the services above therefore costs no data: the containers are
# recreated, the volumes are found again by these explicit names.
volumes:
  api_data:
    name: ${VOLUME_PREFIX}_api_data
  postgres_data:
    name: ${VOLUME_PREFIX}_postgres_data
  redis_data:
    name: ${VOLUME_PREFIX}_redis_data
  minio_data:
    name: ${VOLUME_PREFIX}_minio_data
  db_backups:
    name: ${VOLUME_PREFIX}_db_backups
