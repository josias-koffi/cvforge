# Jobspark stack as Dokploy runs it. Standalone: no build, images only.
#
# Dokploy owns this file's lifecycle through `dokploy_compose` in
# ../dokploy/compose.tf, which ships it inline (`raw.compose_file`). Dokploy
# names the compose project itself, resolves the variables below from the `env`
# block of that resource, and injects the Traefik labels from the
# `dokploy_domain` resources. Never edit the deployed copy in the Dokploy UI.
#
# Differences from the SSH-pipeline file next door (docker-compose.yml):
#   - no `name:` — Dokploy assigns the compose project name
#   - no Traefik labels and no external `traefik-public` network — Dokploy's own
#     Traefik routes from the `dokploy_domain` resources instead
#   - API_INTERNAL_URL goes through the public API host instead of an internal
#     service name — see the comment on the web service below

services:
  web:
    image: ghcr.io/josias-koffi/jobspark-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-}
      # NOT `http://api:3333`. Dokploy puts every stack on the shared
      # `dokploy-network` and registers each compose service name as an alias
      # there, so production and staging both publish the alias `api` on one
      # network. Docker then answers with whichever container it likes: from
      # production's web container, `getent hosts api` returned staging's API.
      # The magic link it built carried staging's URLs, so the session cookie
      # landed on the staging domain and nobody could sign in to production.
      #
      # Going through the public host is unambiguous by construction. The
      # request stays on the box — out to the VPS address, back in through
      # Dokploy's Traefik — at the cost of one TLS hop.
      #
      # The alternative, prefixing the service names so each alias is unique,
      # is blocked by Dokploy: it refuses a compose whose services no longer
      # match the `service_name` of an existing domain, and it deploys the
      # compose before Terraform updates the domains. See docs/deploy.md.
      API_INTERNAL_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  landing:
    image: ghcr.io/josias-koffi/jobspark-landing:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The landing only links to the app; /login redirects to this origin.
      APP_URL: https://${WEB_DOMAIN}
      # Who the visitor is, for the per-IP limits (US-132, ADR-022). Empty,
      # the default, uses the X-Forwarded-For Traefik rewrites. Set it to
      # cf-connecting-ip only once the records are orange-clouded: without
      # Cloudflare in front, any visitor can write that header themselves.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Signs the visitor's address relayed to the API (US-132). Same value as
      # the API's; empty relays nothing.
      LANDING_PROXY_SECRET: ${LANDING_PROXY_SECRET:-}
      # Canonical URLs and OG images: pages rendered at request time read it
      # here, not from the value baked in at build.
      NEXT_PUBLIC_SITE_URL: https://${LANDING_DOMAIN}
      # Credit offers for the pricing section. Public host, never `http://api`:
      # see the web service above.
      API_INTERNAL_URL: https://${API_DOMAIN}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    image: ghcr.io/josias-koffi/jobspark-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${WEB_DOMAIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      PUPPETEER_URL: ${PUPPETEER_URL:-http://puppeteer:3000}
      APP_VERSION: ${APP_VERSION:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Offer collection. A container only receives what this list names: a
      # value set anywhere else reaches the stack's .env, never the process.
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID:-}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET:-}
      FRANCE_TRAVAIL_APIS: ${FRANCE_TRAVAIL_APIS:-offres,romeo,rome-metiers,rome-competences,rome-fiches-metiers,rome-substitutions,marche-travail,la-bonne-boite,pages-employeurs}
      LA_BONNE_ALTERNANCE_API_KEY: ${LA_BONNE_ALTERNANCE_API_KEY:-}
      # Continuous collection (ADR-027): always on, each candidate picks their alerts.
      JOB_STREAM_INTERVAL_MINUTES: ${JOB_STREAM_INTERVAL_MINUTES:-5}
      JOB_BOARDS_INTERVAL_MINUTES: ${JOB_BOARDS_INTERVAL_MINUTES:-30}
      JOB_ALERT_DAILY_IMMEDIATE_CAP: ${JOB_ALERT_DAILY_IMMEDIATE_CAP:-10}
      JOB_ALERT_ENRICH_DAILY_CAP: ${JOB_ALERT_ENRICH_DAILY_CAP:-20}
      FRANCE_TRAVAIL_OFFRES_MONTHLY_QUOTA: ${FRANCE_TRAVAIL_OFFRES_MONTHLY_QUOTA:-}
      # Management key: balance supervision only, inert when empty.
      OPENROUTER_MANAGEMENT_API_KEY: ${OPENROUTER_MANAGEMENT_API_KEY:-}
      OPENROUTER_BALANCE_ALERT_THRESHOLD: ${OPENROUTER_BALANCE_ALERT_THRESHOLD:-5}
      OPENROUTER_BALANCE_CRITICAL_THRESHOLD: ${OPENROUTER_BALANCE_CRITICAL_THRESHOLD:-0}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      OPENROUTER_MAX_ATTEMPTS: ${OPENROUTER_MAX_ATTEMPTS:-3}
      # Live interview voice, straight to OpenAI (ADR-026). Blank keeps the defaults.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INTERVIEW_REALTIME_MODEL: ${INTERVIEW_REALTIME_MODEL:-}
      INTERVIEW_REALTIME_VOICE: ${INTERVIEW_REALTIME_VOICE:-}
      INTERVIEW_REALTIME_EAGERNESS: ${INTERVIEW_REALTIME_EAGERNESS:-}
      INTERVIEW_REALTIME_NOISE_REDUCTION: ${INTERVIEW_REALTIME_NOISE_REDUCTION:-}
      INTERVIEW_REALTIME_TURN_DETECTION: ${INTERVIEW_REALTIME_TURN_DETECTION:-}
      INTERVIEW_REALTIME_VAD_THRESHOLD: ${INTERVIEW_REALTIME_VAD_THRESHOLD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      AUTH_MAGIC_LINK_TTL_MINUTES: ${AUTH_MAGIC_LINK_TTL_MINUTES:-15}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-7}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      SMTP_PROVIDER: ${SMTP_PROVIDER}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      # Replies to the no-reply sender land here; the footer names it too.
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # Serves the logo and the legal pages every e-mail links to.
      LANDING_URL: https://${LANDING_DOMAIN}
      # Public routes (ADR-022). Listed one by one: a container only receives
      # what this list names, so a value set only in the stack's .env would
      # never reach the process.
      ATS_IP_HASH_SECRET: ${ATS_IP_HASH_SECRET:-}
      ATS_PUBLIC_HOURLY_LIMIT: ${ATS_PUBLIC_HOURLY_LIMIT:-}
      ATS_PUBLIC_DAILY_LIMIT: ${ATS_PUBLIC_DAILY_LIMIT:-}
      ATS_PUBLIC_DAILY_BUDGET: ${ATS_PUBLIC_DAILY_BUDGET:-}
      # Lets the landing vouch for the visitor's address, which Traefik
      # overwrites on the way in (US-132). Empty: the relay is ignored.
      LANDING_PROXY_SECRET: ${LANDING_PROXY_SECRET:-}
    volumes:
      # Real datastore of the API (JSON state files) — never drop this volume.
      - api_data:/workspace/.data
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Same trap as `api` (see the web service): Dokploy publishes the alias
    # `postgres` for both environments on `dokploy-network`, so the API could
    # reach the other environment's database. Clients use this per-environment
    # alias instead; the service name itself stays, Dokploy rejects renames.
    networks:
      default:
        aliases:
          - ${POSTGRES_HOST}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvforge}
      POSTGRES_USER: ${POSTGRES_USER:-cvforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvforge}"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data

  puppeteer:
    image: ghcr.io/josias-koffi/jobspark-puppeteer:${IMAGE_TAG}
    restart: unless-stopped

  # Nightly pg_dump → custom-format archive in the pg_backups volume, restored
  # with `pg_restore`. Keeps 7 daily + 4 weekly + 6 monthly snapshots.
  # Whole database, not just `public`: the `drizzle` schema holds the migration
  # journal, without which the API replays every migration onto a restored base.
  # WARNING: on-VPS backup only — it does NOT survive VPS destruction.
  db_backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB:-cvforge}
      POSTGRES_USER: ${POSTGRES_USER:-cvforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "--format=custom"
      BACKUP_SUFFIX: ".dump"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - pg_backups:/backups

  # Restores every new dump — the local one of db_backup and the off-site one
  # Dokploy ships to R2 (fetched by r2_fetch) — into a throwaway Postgres inside
  # this container, compares its migrations with the live database (a dump that
  # predates a deploy's migrations is accepted once), and e-mails
  # RESTORE_CHECK_ALERT_TO when a restore fails or a source has no dump under
  # 26 h old. Unhealthy when either source's last success is older than 26 h.
  # `docker exec <container> sh /restore-check.sh alert-test` sends a test alert.
  restore_check:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      - postgres
    entrypoint: ["/bin/sh", "/restore-check.sh"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB:-cvforge}
      POSTGRES_USER: ${POSTGRES_USER:-cvforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Resend's SMTP password is its API key; the alert goes through its HTTP API.
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      RESTORE_CHECK_ALERT_TO: ${RESTORE_CHECK_ALERT_TO}
      RESTORE_CHECK_ENV: ${RESTORE_CHECK_ENV}
      # Hash of this file, set by OpenTofu: recreates the container on a script edit.
      RESTORE_CHECK_REV: ${RESTORE_CHECK_REV:-}
    configs:
      - source: restore_check_script
        target: /restore-check.sh
    volumes:
      - pg_backups:/backups:ro
      - r2_check:/r2:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -n "$$(find /var/lib/restore-check/ok-local -mmin -1560 2>/dev/null)"
          && test -n "$$(find /var/lib/restore-check/ok-r2 -mmin -1560 2>/dev/null)"
      interval: 5m
      timeout: 10s
      start_period: 15m

  # Copies the newest Dokploy dump of this environment from R2 into r2_check,
  # for restore_check to test; keeps that one file only.
  r2_fetch:
    image: rclone/rclone:1.75.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/r2-fetch.sh"]
    environment:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_BACKUP_ENDPOINT}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_BACKUP_ACCESS_KEY}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_BACKUP_SECRET_ACCESS_KEY}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET}
      # Same prefix as dokploy_backup.postgres in infra/dokploy/backup.tf.
      R2_DB_PREFIX: db/${RESTORE_CHECK_ENV}/
      RESTORE_CHECK_REV: ${RESTORE_CHECK_REV:-}
    configs:
      - source: r2_fetch_script
        target: /r2-fetch.sh
    volumes:
      - r2_check:/r2

# Volume names are pinned to VOLUME_PREFIX instead of the compose project name,
# so production keeps using the volumes created under the old `cvforge` project.
volumes:
  api_data:
    name: ${VOLUME_PREFIX}_api_data
  postgres_data:
    name: ${VOLUME_PREFIX}_postgres_data
  redis_data:
    name: ${VOLUME_PREFIX}_redis_data
  minio_data:
    name: ${VOLUME_PREFIX}_minio_data
  # Not `${VOLUME_PREFIX}_db_backups`: in production that volume was shared with
  # the pre-Dokploy stack, whose sidecar wrote the same filenames at the same
  # time and interleaved the dumps. It stays on disk, detached, for its history.
  pg_backups:
    name: ${VOLUME_PREFIX}_pg_backups
  r2_check:
    name: ${VOLUME_PREFIX}_r2_check

# Inline because Dokploy receives this file alone, nothing else of the repo.
# Every `$` of the script is doubled, or compose would interpolate it.
configs:
  restore_check_script:
    content: |
      #!/bin/sh
      set -u

      STATE=/var/lib/restore-check
      MAX_AGE_MIN=1560 # 26 h: one daily dump plus slack
      # name|newest dump|reader — the db_backup dump is a plain custom-format
      # archive, the Dokploy one fetched from R2 by r2_fetch is gzipped.
      SOURCES="local|/backups/last/$${POSTGRES_DB}-latest.dump|cat
      r2|/r2/latest.sql.gz|zcat"

      mkdir -p "$$STATE" && chown postgres "$$STATE"

      # Lines joined by `\n`, with none after the last: a trailing one would
      # land inside the From and To addresses, which Resend rejects (422).
      json() { printf '%s' "$$1" | tr '\t\r' '  ' | sed 's/\\/\\\\/g; s/"/\\"/g' | awk 'NR > 1 { printf "\\n" } { printf "%s", $$0 }'; }

      alert() {
        echo "ALERT: $$1"
        printf '%s\n' "$$2"
        body="{\"from\":\"$$(json "$$EMAIL_FROM")\",\"to\":[\"$$(json "$$RESTORE_CHECK_ALERT_TO")\"],\"subject\":\"$$(json "[$${RESTORE_CHECK_ENV}] $$1")\",\"text\":\"$$(json "$$2")\"}"
        wget -q -O /dev/null --header "Authorization: Bearer $${SMTP_PASSWORD}" \
          --header "Content-Type: application/json" --post-data "$$body" https://api.resend.com/emails \
          || echo "could not send the alert e-mail"
      }

      live() { PGPASSWORD="$$POSTGRES_PASSWORD" psql -h "$$POSTGRES_HOST" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atc "$$1"; }
      scratch() { su-exec postgres psql -h "$$STATE" -d restore_check -Atc "$$1"; }

      TABLES="select count(*) from information_schema.tables where table_schema in ('public', 'drizzle')"
      MIGRATIONS="select hash from drizzle.__drizzle_migrations order by id"
      ACCOUNTS="select count(*) from auth_accounts"

      lines() { printf '%s\n' "$$1" | grep -c .; }

      # A deploy applies migrations after the last dump was taken: a dump whose
      # migrations are the first ones of live is accepted, once. The live count
      # is kept as a floor that the next dump of source $$1 must reach.
      # Prints what is wrong, nothing when the restored migrations are acceptable.
      compare_migrations() {
        got=$$(scratch "$$MIGRATIONS" 2>&1); want=$$(live "$$MIGRATIONS" 2>&1)
        n_got=$$(lines "$$got"); n_want=$$(lines "$$want")
        floor=$$(cat "$$STATE/floor-$$1" 2>/dev/null || echo 0)
        if [ "$$got" = "$$want" ]; then
          got=$$(scratch "$$TABLES" 2>&1); want=$$(live "$$TABLES" 2>&1)
          [ "$$got" = "$$want" ] || echo "restored tables = $$got, live = $$want"
        elif [ "$$n_got" -gt 0 ] && [ "$$n_got" -ge "$$floor" ] \
          && [ "$$got" = "$$(printf '%s\n' "$$want" | head -n "$$n_got")" ]; then
          echo "$$n_want" > "$$STATE/floor-$$1"
          echo "$$1: dump is $$((n_want - n_got)) migration(s) behind live, accepted once" >&2
        elif [ "$$n_got" -lt "$$floor" ]; then
          echo "restored migrations = $$n_got, still behind the $$floor already live when the previous dump was checked"
        else
          echo "restored migrations ($$n_got) are not the first ones of live ($$n_want)"
        fi
      }

      # Prints what is wrong with dump $$1 read by $$2 for source $$3, nothing when it restores and matches.
      verify() {
        rm -rf "$$STATE/pgdata"
        su-exec postgres initdb -D "$$STATE/pgdata" -U postgres --auth=trust >/dev/null 2>&1 || { echo "initdb failed"; return; }
        su-exec postgres pg_ctl -D "$$STATE/pgdata" -o "-c listen_addresses='' -k $$STATE" -w -l "$$STATE/server.log" start >/dev/null \
          || { echo "scratch server did not start"; return; }
        su-exec postgres createdb -h "$$STATE" restore_check
        # Read by root and piped: the dump need not be readable by `postgres`.
        if ! "$$2" "$$1" | su-exec postgres pg_restore -h "$$STATE" -d restore_check --no-owner --exit-on-error 2>"$$STATE/restore.log"; then
          echo "pg_restore failed:"; tail -5 "$$STATE/restore.log"
        else
          compare_migrations "$$3"
          [ "$$(scratch "$$ACCOUNTS" 2>&1)" -gt 0 ] 2>/dev/null || echo "auth_accounts is empty in the restored dump"
        fi
        su-exec postgres pg_ctl -D "$$STATE/pgdata" -m immediate stop >/dev/null
        rm -rf "$$STATE/pgdata"
      }

      check() {
        src=$$1 dump=$$(readlink -f "$$2" 2>/dev/null)
        if [ -z "$$dump" ] || [ ! -e "$$dump" ] || [ -n "$$(find "$$dump" -mmin +$$MAX_AGE_MIN)" ]; then
          # Once a day, not every loop.
          if [ -z "$$(find "$$STATE/stale-$$src" -mmin -1440 2>/dev/null)" ]; then
            case $$src in
              r2) hint="Vérifier la sauvegarde Dokploy vers R2 (3 h) et le conteneur r2_fetch." ;;
              *) hint="Vérifier le conteneur db_backup." ;;
            esac
            alert "Aucune sauvegarde $$src récente" "Pas de dump $$src de moins de 26 h (dernier : $${dump:-aucun}). $$hint"
            touch "$$STATE/stale-$$src"
          fi
        elif [ "$$dump" != "$$(cat "$$STATE/checked-$$src" 2>/dev/null)" ]; then
          echo "checking $$src $$dump"
          problems=$$(verify "$$dump" "$$3" "$$src")
          if [ -z "$$problems" ]; then
            echo "restore OK ($$src)"; touch "$$STATE/ok-$$src"
          else
            alert "Échec du test de restauration ($$src)" "Le dump $$dump ne se restaure pas correctement :

      $$problems"
          fi
          echo "$$dump" > "$$STATE/checked-$$src"
        fi
      }

      if [ "$${1:-}" = "alert-test" ]; then
        alert "Test de l'alerte de restauration" "Alerte de test envoyée à la main depuis restore_check. Rien à faire."
        exit 0
      fi

      while true; do
        echo "$$SOURCES" | while IFS='|' read -r src latest reader; do check "$$src" "$$latest" "$$reader"; done
        sleep 600
      done
  r2_fetch_script:
    content: |
      #!/bin/sh
      set -u

      while true; do
        newest=$$(rclone lsf -R --files-only --format tp --include "**/$${R2_DB_PREFIX}*.sql.gz" "r2:$${R2_BACKUP_BUCKET}" 2>/tmp/lsf.err | sort | tail -1 | cut -d';' -f2)
        name=$$(basename "$${newest:-none}")
        if [ -z "$$newest" ]; then
          echo "no dump listed under $${R2_DB_PREFIX}: $$(tail -1 /tmp/lsf.err)"
        elif [ ! -e "/r2/$$name" ]; then
          if rclone copyto "r2:$${R2_BACKUP_BUCKET}/$$newest" /r2/.partial; then
            mv /r2/.partial "/r2/$$name" && ln -sfn "$$name" /r2/latest.sql.gz
            find /r2 -maxdepth 1 -name '*.sql.gz' ! -name "$$name" ! -name latest.sql.gz -delete
            echo "fetched $$newest"
          fi
        fi
        sleep 600
      done
