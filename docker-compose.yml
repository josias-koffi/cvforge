services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3100:3100"
    environment:
      API_INTERNAL_URL: http://api:3333
    depends_on:
      - api

  landing:
    build:
      context: .
      dockerfile: docker/landing.Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "3001:3001"
    environment:
      NEXT_DIST_DIR: tmp/cvforge-landing-next
      APP_URL: http://localhost:3100
      API_INTERNAL_URL: http://api:3333
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/landing:/workspace/apps/landing
      - ./packages/types:/workspace/packages/types
      - ./packages/config:/workspace/packages/config

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://cvforge:secret@postgres:5432/cvforge
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      PUPPETEER_URL: http://puppeteer:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3333
      SMTP_PROVIDER: ${SMTP_PROVIDER}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      AUTH_MAGIC_LINK_TTL_MINUTES: ${AUTH_MAGIC_LINK_TTL_MINUTES}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      AUTH_STATE_FILE: ${AUTH_STATE_FILE:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MANAGEMENT_API_KEY: ${OPENROUTER_MANAGEMENT_API_KEY:-}
      OPENROUTER_BALANCE_ALERT_THRESHOLD: ${OPENROUTER_BALANCE_ALERT_THRESHOLD:-5}
      OPENROUTER_BALANCE_CRITICAL_THRESHOLD: ${OPENROUTER_BALANCE_CRITICAL_THRESHOLD:-0}
      # Model chains. Blank means the defaults compiled into the API.
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      OPENROUTER_MAX_ATTEMPTS: ${OPENROUTER_MAX_ATTEMPTS:-3}
      INTERVIEW_STT_MODEL: ${INTERVIEW_STT_MODEL:-}
      INTERVIEW_STT_FALLBACK_MODELS: ${INTERVIEW_STT_FALLBACK_MODELS:-}
      INTERVIEW_VOICE_MODEL: ${INTERVIEW_VOICE_MODEL:-}
      INTERVIEW_VOICE_FALLBACK_MODELS: ${INTERVIEW_VOICE_FALLBACK_MODELS:-}
      INTERVIEW_VOICE: ${INTERVIEW_VOICE:-}
      INTERVIEW_VOICE_MAX_ATTEMPTS: ${INTERVIEW_VOICE_MAX_ATTEMPTS:-}
      INTERVIEW_VOICE_MAX_TOKENS: ${INTERVIEW_VOICE_MAX_TOKENS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - postgres
      - minio
      - redis
      - puppeteer
    volumes:
      - ./apps/api:/workspace/apps/api
      - /workspace/apps/api/node_modules
      - ./packages/document-renderer:/workspace/packages/document-renderer
      - /workspace/packages/document-renderer/dist
      - ./packages/types:/workspace/packages/types
      - ./packages/config:/workspace/packages/config

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cvforge
      POSTGRES_USER: cvforge
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cvforge
      MINIO_ROOT_PASSWORD: secretminio
    volumes:
      - minio_data:/data

  puppeteer:
    build:
      context: .
      dockerfile: docker/puppeteer.Dockerfile
    ports:
      - "3002:3000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data:
