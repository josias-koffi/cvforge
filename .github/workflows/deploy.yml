name: Deploy

# Merge on develop → staging, merge on main → production.
# workflow_dispatch redeploys or rolls back to any previously built image tag.

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag to deploy (short sha). Defaults to the current ref sha."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  OWNER: josias-koffi

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      web_domain: ${{ steps.target.outputs.web_domain }}
      api_domain: ${{ steps.target.outputs.api_domain }}
      landing_domain: ${{ steps.target.outputs.landing_domain }}
    steps:
      - name: Resolve environment, tag and domains
        id: target
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_ENVIRONMENT}" ]; then
            ENVIRONMENT="${INPUT_ENVIRONMENT}"
          elif [ "${REF_NAME}" = "main" ]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="staging"
          fi

          IMAGE_TAG="${INPUT_IMAGE_TAG:-${GITHUB_SHA:0:7}}"
          if ! printf '%s' "${IMAGE_TAG}" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "image_tag must be a short or full commit sha." >&2
            exit 1
          fi

          # Only the smoke test reads these. The stack name, the volume prefix
          # and the domains Traefik serves are owned by infra/dokploy.
          if [ "${ENVIRONMENT}" = "production" ]; then
            LANDING_DOMAIN="cvspark.koklo.dev"
            WEB_DOMAIN="cvspark-app.koklo.dev"
            API_DOMAIN="cvspark-api.koklo.dev"
          else
            LANDING_DOMAIN="cvspark-staging.koklo.dev"
            WEB_DOMAIN="cvspark-app-staging.koklo.dev"
            API_DOMAIN="cvspark-api-staging.koklo.dev"
          fi

          {
            echo "environment=${ENVIRONMENT}"
            echo "image_tag=${IMAGE_TAG}"
            echo "landing_domain=${LANDING_DOMAIN}"
            echo "web_domain=${WEB_DOMAIN}"
            echo "api_domain=${API_DOMAIN}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build & push ${{ matrix.service }}
    if: github.event_name == 'push'
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cvspark-web
            dockerfile: docker/web.Dockerfile
          - service: cvspark-landing
            dockerfile: docker/landing.Dockerfile
          - service: cvspark-api
            dockerfile: docker/api.Dockerfile
          - service: cvspark-puppeteer
            dockerfile: docker/puppeteer.Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the landing bakes public URLs at build time; web and api read
          # them at runtime.
          build-args: |
            NEXT_PUBLIC_APP_URL=https://${{ needs.resolve.outputs.web_domain }}
            NEXT_PUBLIC_API_URL=https://${{ needs.resolve.outputs.api_domain }}
            NEXT_PUBLIC_SITE_URL=https://${{ needs.resolve.outputs.landing_domain }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service }}:cache,mode=max

  # The image is deployed without anyone ever having started it: a crash at
  # boot only surfaces in the smoke test, which runs after `tofu apply` — so
  # the environment is already broken by the time it fails. That is exactly how
  # a circular import between a middleware and its service took staging's API
  # down: it passed 593 unit tests, because Vitest's ESM graph resolves the
  # cycle that the compiled CommonJS build does not.
  verify-image:
    name: Boot the API image
    needs: [resolve, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Migrations run first in the image's own CMD, so this also proves the
      # new migration applies to a real PostgreSQL 16 — not just to the PGlite
      # the test suite uses.
      - name: Start the image against a disposable PostgreSQL
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/cvspark-api:${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker run -d --name api-verify --network host \
            -e NODE_ENV=production \
            -e PORT=3333 \
            -e DATABASE_URL=postgres://verify:verify@127.0.0.1:5432/verify \
            -e AUTH_SESSION_SECRET=verify-only-not-a-real-secret \
            -e OPENROUTER_API_KEY=verify-only-not-a-real-key \
            -e OPENAI_API_KEY=verify-only-not-a-real-key \
            -e APP_VERSION=${{ needs.resolve.outputs.image_tag }} \
            "${IMAGE}"

      - name: Wait for /health and /ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3333/health; then
              echo "api answered after ${attempt} attempt(s)"
              curl -fsS http://127.0.0.1:3333/health
              echo
              # /ready queries the database, so it also covers the migration.
              curl -fsS -o /dev/null http://127.0.0.1:3333/ready
              echo "ready: ok"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API image never became healthy. Container logs follow."
          exit 1

      - name: Container logs
        if: always()
        run: docker logs api-verify 2>&1 | tail -80

      - name: Stop the container
        if: always()
        run: docker rm -f api-verify

  tofu:
    name: OpenTofu (DNS)
    needs: [resolve, build, verify-image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: cvspark-tofu
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_cf_api_token: ${{ secrets.CF_API_TOKEN }}
      TF_VAR_cf_zone_id: ${{ secrets.CF_ZONE_ID }}
      TF_VAR_vps20_ip: ${{ secrets.VPS20_IP }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Init
        run: tofu init -input=false

      - name: Plan
        id: plan
        run: |
          set +e
          tofu plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes pending.
          # Only 1 is a failure; 2 is the nominal case that gates the apply.
          if [ "${code}" -eq 1 ]; then
            exit 1
          fi
          echo "changes=${code}" >> "${GITHUB_OUTPUT}"

      - name: Publish plan
        run: |
          {
            echo '## OpenTofu plan'
            echo '```'
            tofu show -no-color tfplan
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply
        if: steps.plan.outputs.changes == '2'
        run: tofu apply -input=false -lock-timeout=5m tfplan

  deploy:
    name: Deploy ${{ needs.resolve.outputs.environment }}
    needs: [resolve, tofu]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: cvspark-deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/dokploy
    env:
      TF_IN_AUTOMATION: "true"
      # One Dokploy instance, one key, hence a repository-level secret.
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
      TF_VAR_environment: ${{ needs.resolve.outputs.environment }}
      TF_VAR_image_tag: ${{ needs.resolve.outputs.image_tag }}
      # Secrets of THIS environment only: the job carries `environment:` above,
      # so it sees the staging or the production set, never both. Every
      # non-secret setting is a default in infra/dokploy/variables.tf.
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_minio_access_key: ${{ secrets.MINIO_ACCESS_KEY }}
      TF_VAR_minio_secret_key: ${{ secrets.MINIO_SECRET_KEY }}
      TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      # Optional: absent secret means an empty string, which simply leaves
      # balance supervision off rather than failing the deploy.
      TF_VAR_openrouter_management_api_key: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
      # Optional too: without them the offer collection simply calls no source.
      TF_VAR_france_travail_client_id: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
      TF_VAR_france_travail_client_secret: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
      TF_VAR_la_bonne_alternance_api_key: ${{ secrets.LA_BONNE_ALTERNANCE_API_KEY }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_auth_session_secret: ${{ secrets.AUTH_SESSION_SECRET }}
      TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      TF_VAR_next_server_actions_encryption_key: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
      # Optional, like the OpenRouter management key: an absent secret means an
      # empty salt, which the API replaces with a per-process random one rather
      # than failing the deploy.
      TF_VAR_ats_ip_hash_secret: ${{ secrets.ATS_IP_HASH_SECRET }}
      # Optional too: without it the landing's visitors share one rate-limit
      # counter at the API (US-132).
      TF_VAR_landing_proxy_secret: ${{ secrets.LANDING_PROXY_SECRET }}
      # Not a secret: an environment variable, set to cf-connecting-ip only
      # once Cloudflare proxies the records. Unset keeps the safe default.
      TF_VAR_client_ip_header: ${{ vars.CLIENT_IP_HEADER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Init
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
        run: |
          tofu init -input=false \
            -backend-config="key=cvspark/dokploy-${ENVIRONMENT}.tfstate"

      - name: Plan
        id: plan
        run: |
          set +e
          tofu plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes pending.
          # Only 1 is a failure; 2 is the nominal case that gates the apply.
          if [ "${code}" -eq 1 ]; then
            exit 1
          fi
          echo "changes=${code}" >> "${GITHUB_OUTPUT}"

      - name: Publish plan
        run: |
          {
            echo '## Dokploy plan'
            echo '```'
            tofu show -no-color tfplan
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Dokploy redeploys the stack and the apply blocks until the deploy
      # reaches a terminal status (deployment_timeout, 15m by default).
      - name: Apply
        if: steps.plan.outputs.changes == '2'
        run: tofu apply -input=false -lock-timeout=5m tfplan

      - name: Smoke test
        env:
          LANDING_DOMAIN: ${{ needs.resolve.outputs.landing_domain }}
          WEB_DOMAIN: ${{ needs.resolve.outputs.web_domain }}
          API_DOMAIN: ${{ needs.resolve.outputs.api_domain }}
        run: |
          set -euo pipefail
          for url in \
            "https://${API_DOMAIN}/health" \
            "https://${WEB_DOMAIN}/login" \
            "https://${LANDING_DOMAIN}/"; do
            echo "checking ${url}"
            curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "${url}"
          done

      # Reaching a 200 only proves something is up. The previous image answers
      # those checks just as well, which is how staging once served a build
      # five deploys old with every run reported successful. So ask each
      # container which build it is, and fail when it is not this one.
      - name: Assert the deployed version
        env:
          WEB_DOMAIN: ${{ needs.resolve.outputs.web_domain }}
          API_DOMAIN: ${{ needs.resolve.outputs.api_domain }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          for target in "api https://${API_DOMAIN}/health" "web https://${WEB_DOMAIN}/version"; do
            set -- ${target}
            service="$1"
            url="$2"
            # The container may still be rolling over; retry before judging.
            for attempt in $(seq 1 10); do
              running=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "${url}" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')
              [ "${running}" = "${IMAGE_TAG}" ] && break
              echo "${service}: serving '${running}', waiting for '${IMAGE_TAG}' (${attempt}/10)"
              sleep 10
            done
            if [ "${running}" != "${IMAGE_TAG}" ]; then
              echo "::error::${service} still serves '${running}' instead of '${IMAGE_TAG}'." \
                   "The stack reported success but the container was never replaced."
              exit 1
            fi
            echo "${service}: running ${running}"
          done

      - name: Summary
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          WEB_DOMAIN: ${{ needs.resolve.outputs.web_domain }}
        run: |
          {
            echo "## Deployed"
            echo "- environment: ${ENVIRONMENT}"
            echo "- image tag: ${IMAGE_TAG}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- app: https://${WEB_DOMAIN}"
          } >> "${GITHUB_STEP_SUMMARY}"
