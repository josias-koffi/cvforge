name: One-off - realign production Dokploy state addresses

# Manual, single-purpose workflow. The Jobspark rename changed the Terraform
# resource addresses in infra/dokploy (dokploy_project.cvspark -> .jobspark,
# etc.) while the real production Dokploy project (cvspark-vxlxow-*, live,
# 437 applications) is still tracked in state under the OLD addresses. The
# next ordinary production apply would therefore plan to destroy that project
# and create an empty one. `state mv` realigns the addresses with zero
# infrastructure change — no provider API call, no container touched.
#
# Deliberately does NOT run `apply`. It only moves state and prints a plan for
# a human to review before this workflow file is deleted and a normal
# production deploy ever runs.

on:
  workflow_dispatch: {}

jobs:
  state-mv:
    name: Realign state (no apply)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/dokploy
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      TF_VAR_environment: production
      TF_VAR_image_tag: latest
      TF_VAR_postgres_password: "placeholder-not-used-for-state-mv"
      TF_VAR_minio_access_key: "placeholder"
      TF_VAR_minio_secret_key: "placeholder"
      TF_VAR_openrouter_api_key: "placeholder"
      TF_VAR_openai_api_key: "placeholder"
      TF_VAR_france_travail_client_id: "placeholder"
      TF_VAR_france_travail_client_secret: "placeholder"
      TF_VAR_stripe_secret_key: "placeholder"
      TF_VAR_stripe_webhook_secret: "placeholder"
      TF_VAR_auth_session_secret: "placeholder"
      TF_VAR_smtp_user: "placeholder"
      TF_VAR_smtp_password: "placeholder"
      TF_VAR_next_server_actions_encryption_key: "placeholder"
      TF_VAR_ats_ip_hash_secret: "placeholder"
      TF_VAR_landing_proxy_secret: "placeholder"
      TF_VAR_r2_backup_endpoint: ${{ secrets.R2_ENDPOINT }}
      TF_VAR_r2_backup_access_key: "placeholder"
      TF_VAR_r2_backup_secret_access_key: "placeholder"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Init (production state)
        run: tofu init -input=false -backend-config="key=cvspark/dokploy-production.tfstate"

      - name: Show current state addresses
        run: tofu state list

      - name: Move project/compose/domain to the jobspark addresses
        # Tolerates "already moved" (source address not found) so this step
        # is safe to re-run after a partial or repeated execution.
        run: |
          tofu state mv 'dokploy_project.cvspark' 'dokploy_project.jobspark' || true
          tofu state mv 'dokploy_compose.cvspark' 'dokploy_compose.jobspark' || true
          tofu state mv 'dokploy_domain.cvspark' 'dokploy_domain.jobspark' || true

      - name: Plan (review only — no apply)
        run: tofu plan -input=false -lock-timeout=5m -out=tfplan || true

      - name: Publish plan
        run: |
          {
            echo '## State realignment — plan for review (NOT applied)'
            echo '```'
            tofu show -no-color tfplan || echo "(plan step above may have failed — check the Plan log)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
